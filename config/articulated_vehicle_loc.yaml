# 针对绞接车辆 rookie_articulated 的定位配置
# LiDAR: Polka 6-LiDAR 融合点云 (/polka/merged_cloud, frame: base_footprint)
# IMU: rear_top 内置 IMU (/imu/rear_top, frame: rear_top_lidar_link)

common:
  dataset: "custom"
  lidar_topic: "/polka/merged_cloud"
  livox_lidar_topic: "/livox/lidar"  # unused
  imu_topic: "/imu/rear_top"

# fasterlio 参数
fasterlio:
  lidar_type: 2                # RoboSense Airy 兼容 Velodyne 模式
  scan_line: 96                # RoboSense Airy 96 线
  blind: 0.1                   # 盲区 0.1m
  time_scale: 1.0              # Gazebo 时间戳已是秒级，无需缩放

  skip_lidar_num: 0            # 不跳帧
  point_filter_num: 4          # 点云采样
  max_iteration: 4             # 最大迭代次数
  filter_size_scan: 0.5        # scan 降采样
  filter_size_map: 0.5         # map 降采样

  ivox_grid_resolution: 0.5
  ivox_nearby_type: 18
  esti_plane_threshold: 0.1

  use_aa: false

  acc_cov: 0.1
  gyr_cov: 0.1
  b_acc_cov: 0.0001
  b_gyr_cov: 0.0001
  extrinsic_est_en: false
  # Extrinsic: rear_top IMU (rear_top_lidar_link) -> base_footprint (merged cloud frame)
  extrinsic_T: [ -0.483, 0, 0.353 ]
  extrinsic_R: [ 0.866, 0, -0.5,
                 0, 1, 0,
                 0.5, 0, 0.866 ]
  keep_first_imu_estimation: false
  kf_dis_th: 1.0
  kf_angle_th: 10.0

  enable_icp_part: false
  plane_icp_weight: 300.0
  min_pts: 500
  imu_filter: false
  proj_kfs: false

g2p5:
  esti_floor: false
  lidar_height: 0.0
  floor_height: -1.2
  min_th_floor: 0.50
  max_th_floor: 1.0
  grid_map_resolution: 0.05

system:
  with_loop_closing: false
  with_ui: false
  with_2dui: false
  with_g2p5: false
  step_on_kf: false

  enable_lidar_loc_skip: false
  enable_lidar_loc_rviz: false
  enable_lidar_odom_skip: false
  evaluation: false
  lidar_loc_skip_num: 4
  lidar_odom_skip_num: 2
  map_path: src/robot_navigation/maps/
  pub_tf: true                 # 定位模式: 发布 map -> odom TF

loop_closing:
  loop_kf_gap: 20
  min_id_interval: 20
  closest_id_th: 50
  max_range: 30.0
  ndt_score_th: 1.3
  with_height: true

lidar_loc:
  enable_dynamic_polygon: false
  enable_parking_static: true
  enable_icp_adjust: false
  filter_intensity_max: 100.0
  filter_intensity_min: 10.0
  filter_z_max: 30.0
  filter_z_min: -1.0
  force_2d: false
  grid_search_angle_range: 180.0
  grid_search_angle_step: 60
  lidar_loc_odom_th: 0.5
  init_with_fp: true
  min_init_confidence: 1.8
  update_dynamic_cloud: false
  update_err_h: 0.2
  update_err_v: 0.2
  update_kf_dis: 2.0
  update_lidar_loc_score: 2.5
  loc_on_kf: true
  try_self_extrap: false

maps:
  delete_when_unload: false
  dyn_cloud_policy: persistent
  load_dyn_cloud: true
  load_map_size: 2
  max_pts_dyn_chunk: 100000
  save_dyn_when_quit: false
  save_dyn_when_unload: false
  unload_map_size: 4
  with_dyn_area: false

pgo:
  dr_ang_noise: 0.5
  dr_pos_noise: 1.0
  dr_pos_noise_ratio: 1.0
  lidar_loc_ang_noise: 1.0
  lidar_loc_outlier_th: 5.0
  lidar_loc_pos_noise: 0.3
  lidar_odom_ang_noise: 1.0
  lidar_odom_pos_noise: 0.3
  pgo_frame_converge_ang_th: 1.0
  pgo_frame_converge_pos_th: 0.05
  rtk_fix_ang_noise: 2.0
  rtk_fix_pos_noise: 1.0
  rtk_height_noise_ratio: 10.0
  rtk_other_ang_noise: 10.0
  rtk_other_pos_noise: 5.0
  rtk_outlier_th: 1.0
  smooth_factor: 0.01

roi:
  height_max: 10.0
  height_min: 0.5
  range_max: 30.0
  range_min: 0.5

ui:
  car_length: 3.5
  car_width: 1.8
  car_height: 2.0
  scans: 1
