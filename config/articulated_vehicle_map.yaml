# 当前双 Airy 铰接试验车在线建图配置。
# Polka 输出已经完成动态 TF、多雷达时间对齐和逐点去畸变。

common:
  dataset: "custom"
  lidar_topic: "/polka/merged_cloud"
  livox_lidar_topic: "/livox/lidar" # unused
  imu_topic: "/imu/airy_rear"

# fasterlio 参数
fasterlio:
  lidar_type: 5 # POLKA_MERGED: pre-fused, pre-deskewed XYZI PointCloud2
  scan_line: 96 # RoboSense Airy 96 线
  blind: 0.1 # 盲区 0.1m, 小于盲区距离的不会处理
  time_scale: 1.0 # 兼容不同数据集的时间单位，仅对Velodyne LiDAR(lidar_type=2)生效

  skip_lidar_num: 0 # 不跳帧
  point_filter_num: 6 # 点云采样
  max_iteration: 4 # 最大迭代次数
  filter_size_scan: 0.5 # scan 降采样
  filter_size_map: 0.5 # map 降采样

  ivox_grid_resolution: 0.5
  ivox_nearby_type: 18
  esti_plane_threshold: 0.1

  use_aa: false

  acc_cov: 0.1
  gyr_cov: 0.1
  b_acc_cov: 0.0001
  b_gyr_cov: 0.0001
  extrinsic_est_en: false
  extrinsic_from_tf: true
  lidar_frame_id: base_footprint
  imu_frame_id: rear_lidar_imu_ned
  init_world_from_tf: true
  world_frame_id: rear_lidar_link
  # Extrinsic（lightning 约定：p_IMU = extrinsic_R * p_Lidar + extrinsic_T，
  # 即把点云坐标从 LiDAR 帧映射到 IMU 帧）。
  #   LiDAR 帧 = base_footprint（Polka 融合点云帧）
  #   IMU  帧 = 后雷达内置 IMU raw NED 帧（rear_lidar_imu_ned）
  # 默认在线模式从 TF 读取 T(rear_lidar_imu_ned <- base_footprint)。
  # 下方手动矩阵保留为 extrinsic_from_tf: false 时的 fallback。
  #   R_difop/t_difop 取自后雷达 DIFOP IMU_CALIB(偏移1092)：q=(0.710,-0.704,5e-4,-2e-4), t=(0.00425,0.00418,-0.00446)
  #   T(rear_lidar_link<-base) = 实测 TF base->rear_lidar_link 的逆（平移[-0.6365,0,0.411]，R=[[0,0,-1],[0,-1,0],[-1,0,0]]）
  # 重算时机：后雷达 DIFOP 标定 / 后雷达安装位姿变更。
  extrinsic_T: [-0.000744, 0.640484, -0.415733]
  extrinsic_R: [-0.000992, 0.999963, -0.008486,
                 0.000420, 0.008487, 0.999964,
                 0.999999, 0.000988, -0.000429]
  keep_first_imu_estimation: false
  kf_dis_th: 1.0
  kf_angle_th: 2.0

  enable_icp_part: true
  plane_icp_weight: 300.0
  min_pts: 300
  imu_filter: false
  proj_kfs: false

g2p5:
  esti_floor: false
  lidar_height: 0.0
  floor_height: -1.2
  min_th_floor: 0.50
  max_th_floor: 1.0
  grid_map_resolution: 0.05 # 匹配 Nav2 的 0.05m 分辨率

system:
  with_loop_closing: true
  with_ui: false # 启用 Pangolin 3D UI
  with_2dui: false
  with_g2p5: false
  step_on_kf: false

  enable_lidar_loc_skip: false
  enable_lidar_loc_rviz: false
  enable_lidar_odom_skip: false
  evaluation: false
  lidar_loc_skip_num: 4
  lidar_odom_skip_num: 0
  map_path: src/robot_navigation/maps/ # default save root inside the workspace
  pub_tf: true

loop_closing:
  loop_kf_gap: 20
  min_id_interval: 20
  closest_id_th: 50
  max_range: 30.0
  ndt_score_th: 1.0
  with_height: true # 平面场景，约束高度防 Z 轴漂移

lidar_loc:
  enable_dynamic_polygon: false
  enable_parking_static: true
  enable_icp_adjust: false
  filter_intensity_max: 100.0
  filter_intensity_min: 10.0
  filter_z_max: 30.0
  filter_z_min: -1.0
  force_2d: false
  grid_search_angle_range: 90.0
  grid_search_angle_step: 10
  lidar_loc_odom_th: 0.5
  init_with_fp: true
  min_init_confidence: 0.8
  update_dynamic_cloud: true
  update_err_h: 0.2
  update_err_v: 0.2
  update_kf_dis: 2.0
  update_lidar_loc_score: 2.5
  loc_on_kf: true
  try_self_extrap: false

maps:
  delete_when_unload: false
  dyn_cloud_policy: persistent
  load_dyn_cloud: true
  load_map_size: 2
  max_pts_dyn_chunk: 100000
  save_dyn_when_quit: true
  save_dyn_when_unload: false
  unload_map_size: 4
  with_dyn_area: false

pgo:
  dr_ang_noise: 0.5
  dr_pos_noise: 1.0
  dr_pos_noise_ratio: 1.0
  lidar_loc_ang_noise: 1.0
  lidar_loc_outlier_th: 5.0
  lidar_loc_pos_noise: 0.3
  lidar_odom_ang_noise: 1.0
  lidar_odom_pos_noise: 0.3
  pgo_frame_converge_ang_th: 1.0
  pgo_frame_converge_pos_th: 0.05
  rtk_fix_ang_noise: 2.0
  rtk_fix_pos_noise: 1.0
  rtk_height_noise_ratio: 10.0
  rtk_other_ang_noise: 10.0
  rtk_other_pos_noise: 5.0
  rtk_outlier_th: 1.0
  smooth_factor: 0.01

roi:
  height_max: 10.0
  height_min: -10.0
  range_max: 30.0 # 匹配 LiDAR max_range
  range_min: 0.5

ui:
  car_length: 3.5 # 绞接车辆长度
  car_width: 1.8
  car_height: 1.2
  scans: 1
