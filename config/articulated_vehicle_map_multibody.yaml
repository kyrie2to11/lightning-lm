# 多体多激光雷达建图配置（直接订阅原始 RoboSense Airy 话题，不经过 polka）
#
# 3 部 Airy 激光雷达分布在前后两个车体：
#   - rear  (leader):  rear_lidar_link + rear_lidar_imu
#   - front (non-leader): front_lidar_link + front_lidar_imu
#   - left_front (non-leader): left_front_lidar_link + front_lidar_imu（共享前车体 IMU）
#
# 跨 body 变换通过 TF 查找 leader_imu_frame ← nonleader_imu_frame 实现，
# 依赖 robot_state_publisher 发布的铰接关节 TF。

common:
  dataset: "custom"
  lidar_topic: "/pointcloud/airy_rear"  # 仅 multibody.enabled=false 时使用
  livox_lidar_topic: "/livox/lidar"
  imu_topic: "/imu/airy_rear"

multibody:
  enabled: true
  leader_body_id: rear
  leader_imu_frame: rear_lidar_imu
  sync_tolerance: 0.05  # 50ms 多雷达同步容差

  lidars:
    - id: 0
      body: rear
      topic: /pointcloud/airy_rear
      lidar_frame: rear_lidar_link
      imu_frame: rear_lidar_imu
    - id: 1
      body: front
      topic: /pointcloud/airy_front
      lidar_frame: front_lidar_link
      imu_frame: front_lidar_imu
    - id: 2
      body: front
      topic: /pointcloud/airy_left_front
      lidar_frame: left_front_lidar_link
      imu_frame: front_lidar_imu

  imus:
    - id: 0
      body: rear
      topic: /imu/airy_rear
    - id: 1
      body: front
      topic: /imu/airy_front

  articulation:
    joint_states_topic: /joint_states
    joints:
      - name: lower_articulation_hinge
        body_a: rear        # leader
        body_b: front       # non-leader
        # Pin position in leader base (base_footprint):
        # base_footprint→rear_link: z=0.291, rear_link→pin: z=-0.110
        # → pin in base_footprint: (0, 0, 0.181)
        pin_position_a: [0.0, 0.0, 0.181]
        # Pin position in non-leader base (front_link):
        # pin→front_link: z=0.110 → front_link→pin: z=-0.110
        pin_position_b: [0.0, 0.0, -0.110]
        axis_a: [0.0, 0.0, 1.0]
        zero_offset: 0.0
        joint_state_name: lower_articulation_hinge_joint

# fasterlio 参数（沿用单体的 ESKF / 降采样参数）
fasterlio:
  lidar_type: 4  # ROBOSENSE（带逐点时间戳，需要去畸变）
  scan_line: 96
  blind: 0.1
  time_scale: 1.0

  skip_lidar_num: 0
  point_filter_num: 6
  max_iteration: 4
  filter_size_scan: 0.5
  filter_size_map: 0.5

  ivox_grid_resolution: 0.5
  ivox_nearby_type: 18
  esti_plane_threshold: 0.1

  use_aa: false

  acc_cov: 0.1
  gyr_cov: 0.1
  b_acc_cov: 0.0001
  b_gyr_cov: 0.0001
  extrinsic_est_en: false
  extrinsic_from_tf: true  # 多体模式下外参从 multibody TF 加载
  lidar_frame_id: rear_lidar_link
  imu_frame_id: rear_lidar_imu
  init_world_from_tf: true
  world_frame_id: rear_lidar_link
  # 以下仅在 extrinsic_from_tf: false 时作为 fallback
  extrinsic_T: [-0.000744, 0.640484, -0.415733]
  extrinsic_R: [-0.000992, 0.999963, -0.008486,
                 0.000420, 0.008487, 0.999964,
                 0.999999, 0.000988, -0.000429]
  keep_first_imu_estimation: false
  kf_dis_th: 1.0
  kf_angle_th: 2.0

  enable_icp_part: true
  plane_icp_weight: 300.0
  min_pts: 300
  imu_filter: false
  proj_kfs: false

g2p5:
  esti_floor: false
  lidar_height: 0.0
  floor_height: -1.2
  min_th_floor: 0.50
  max_th_floor: 1.0
  grid_map_resolution: 0.05

system:
  with_loop_closing: true
  with_ui: true
  with_2dui: false
  with_g2p5: false
  step_on_kf: false

  enable_lidar_loc_skip: false
  enable_lidar_loc_rviz: false
  enable_lidar_odom_skip: false
  evaluation: false
  lidar_loc_skip_num: 4
  lidar_odom_skip_num: 0
  map_path: src/robot_navigation/maps/
  pub_tf: true

loop_closing:
  loop_kf_gap: 20
  min_id_interval: 20
  closest_id_th: 50
  max_range: 30.0
  ndt_score_th: 1.0
  with_height: true

lidar_loc:
  enable_dynamic_polygon: false
  enable_parking_static: true
  enable_icp_adjust: false
  filter_intensity_max: 100.0
  filter_intensity_min: 10.0
  filter_z_max: 30.0
  filter_z_min: -1.0
  force_2d: false
  grid_search_angle_range: 90.0
  grid_search_angle_step: 10
  lidar_loc_odom_th: 0.5
  init_with_fp: true
  min_init_confidence: 0.8
  update_dynamic_cloud: true
  update_err_h: 0.2
  update_err_v: 0.2
  update_kf_dis: 2.0
  update_lidar_loc_score: 2.5
  loc_on_kf: true
  try_self_extrap: false

maps:
  delete_when_unload: false
  dyn_cloud_policy: persistent
  load_dyn_cloud: true
  load_map_size: 2
  max_pts_dyn_chunk: 100000
  save_dyn_when_quit: true
  save_dyn_when_unload: false
  unload_map_size: 4
  with_dyn_area: false

pgo:
  dr_ang_noise: 0.5
  dr_pos_noise: 1.0
  dr_pos_noise_ratio: 1.0
  lidar_loc_ang_noise: 1.0
  lidar_loc_outlier_th: 5.0
  lidar_loc_pos_noise: 0.3
  lidar_odom_ang_noise: 1.0
  lidar_odom_pos_noise: 0.3
  pgo_frame_converge_ang_th: 1.0
  pgo_frame_converge_pos_th: 0.05
  rtk_fix_ang_noise: 2.0
  rtk_fix_pos_noise: 1.0
  rtk_height_noise_ratio: 10.0
  rtk_other_ang_noise: 10.0
  rtk_other_pos_noise: 5.0
  rtk_outlier_th: 1.0
  smooth_factor: 0.01

roi:
  height_max: 10.0
  height_min: -10.0
  range_max: 30.0
  range_min: 0.5

ui:
  car_length: 3.5
  car_width: 1.8
  car_height: 1.2
  scans: 1
